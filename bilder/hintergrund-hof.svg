<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <!-- Hintergrund "Hof am Morgen": flaches Licht von links, lange Schatten, ein Kran. Eigene Zeichnung, keine Firmenfarben. -->
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c7d3"/>
      <stop offset="1" stop-color="#f0e2cb"/>
    </linearGradient>
    <pattern id="rippen" width="14" height="10" patternUnits="userSpaceOnUse">
      <rect width="14" height="10" fill="none"/>
      <path d="M2 0v10" stroke="#00000022" stroke-width="2"/>
    </pattern>
    <pattern id="gitter" width="26" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 0L26 40M26 0L0 40M0 0H26M0 40H26" stroke="#2d3842" stroke-width="3" fill="none"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#himmel)"/>
  <circle cx="330" cy="610" r="190" fill="#e8873a"/>
  <circle cx="330" cy="610" r="190" fill="#f6b777" opacity=".35"/>
  <rect y="640" width="1920" height="440" fill="#7b7f84"/>
  <rect y="640" width="1920" height="10" fill="#6c7075"/>
  <rect y="880" width="1920" height="200" fill="#6f7378"/>
  <!-- Container links -->
  <g>
    <rect x="720" y="520" width="260" height="120" fill="#46667f"/>
    <rect x="720" y="520" width="260" height="120" fill="url(#rippen)"/>
    <rect x="990" y="520" width="260" height="120" fill="#a2542f"/>
    <rect x="990" y="520" width="260" height="120" fill="url(#rippen)"/>
    <rect x="855" y="400" width="260" height="120" fill="#6b7580"/>
    <rect x="855" y="400" width="260" height="120" fill="url(#rippen)"/>
  </g>
  <!-- lange Schatten nach rechts -->
  <polygon points="720,640 1250,640 1700,744 1170,744" fill="#1c232b" opacity=".28"/>
  <polygon points="855,520 1115,520 1560,624 1300,624" fill="#1c232b" opacity=".16"/>
  <!-- Kran -->
  <g fill="#2d3842">
    <rect x="1480" y="150" width="30" height="490" fill="url(#gitter)"/>
    <rect x="1476" y="150" width="6" height="490"/>
    <rect x="1508" y="150" width="6" height="490"/>
    <rect x="1130" y="118" width="720" height="22" fill="url(#gitter)"/>
    <rect x="1130" y="118" width="720" height="5"/>
    <rect x="1130" y="135" width="720" height="5"/>
    <rect x="1760" y="140" width="64" height="44" fill="#4e5a66"/>
    <rect x="1458" y="96" width="74" height="24" fill="#e58a2e"/>
    <path d="M1495 96L1150 118M1495 96L1830 118" stroke="#2d3842" stroke-width="3" fill="none"/>
    <path d="M1250 140V330" stroke="#2d3842" stroke-width="3"/>
    <rect x="1236" y="330" width="28" height="22" fill="#e58a2e"/>
  </g>
  <polygon points="1480,640 1510,640 1920,740 1890,740" fill="#1c232b" opacity=".22"/>
  <!-- Holzstapel im Vordergrund -->
  <g>
    <rect x="1280" y="800" width="360" height="26" fill="#b88a5a"/>
    <rect x="1280" y="826" width="360" height="26" fill="#a47a4e"/>
    <rect x="1280" y="852" width="360" height="26" fill="#b88a5a"/>
    <rect x="1280" y="878" width="360" height="26" fill="#a47a4e"/>
    <path d="M1280 800v104M1640 800v104" stroke="#00000033" stroke-width="2"/>
  </g>
  <polygon points="1280,904 1640,904 1900,972 1540,972" fill="#1c232b" opacity=".22"/>
  <!-- Absperrband -->
  <g>
    <rect y="1000" width="1920" height="26" fill="#2a3138"/>
    <path d="M0 1000l26 26M52 1000l26 26M104 1000l26 26M156 1000l26 26M208 1000l26 26M260 1000l26 26M312 1000l26 26M364 1000l26 26M416 1000l26 26M468 1000l26 26M520 1000l26 26" stroke="#e58a2e" stroke-width="14" opacity=".9"/>
  </g>
</svg>
